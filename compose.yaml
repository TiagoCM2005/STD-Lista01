services:
  iot:
    build: ./IOT
    environment:
      - VERSAO=${VERSAO:-v1.0}
    deploy:
      replicas: 1
    volumes:
      - ./IOT/app/build/install/app:/aplicacao

  gerenciador:
    build: ./Gerenciador
    # durante o desenvolvimento
    # necessário executar na máquina local: ./gradlew installDist
    volumes:
      - ./Gerenciador/app/build/install/app:/aplicacao

